[package]
name = "aats-hotcore"
version = "0.1.0"
edition = "2021"
description = "AATS hot core — SNIPE + FAST loops (Rust scaffold placeholder)"

# ARCHITECTURE BOUNDARY (ADR-0002, BLUEPRINT §4.1):
#   This crate owns the SNIPE + FAST loops and is the ONLY code on the
#   block-0 path.  Python NEVER calls into this crate directly.
#   Communication: Redis Streams (events in, KV reads) and local Unix-domain
#   socket to aats-signer for tx signing.
#
# SCAFFOLD NOTE:
#   The real SNIPE/FAST loop logic is NOT yet implemented in Rust.
#   Paper trading runs entirely in the Python controller.
#   This binary is a minimal long-running scaffold that:
#     - Logs a clear "scaffold placeholder" message at startup
#     - Reads DRY_RUN_ENABLED (default true)
#     - Serves GET /health -> 200 on METRICS_PORT (default 9102)
#     - Loops forever so the container stays UP + HEALTHY
#
# REMOVED DEPS (were declared but unused in scaffold):
#   ort = "1.19"      — unbuildable (only 2.0.0-rc.* exists); removed
#   serde / serde_json — unused by scaffold
#   redis              — unused by scaffold
#   solana-sdk / solana-client — unused by scaffold
#   tonic / prost      — unused by scaffold
#   config             — unused by scaffold
#   tokio-util         — unused by scaffold
#   tracing / tracing-subscriber — unused by scaffold (eprintln! used instead)
#   prometheus         — unused by scaffold
#
# KEPT: tokio (async runtime) + hyper stack (HTTP /health endpoint)

[[bin]]
name = "aats-hotcore"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
hyper = { version = "1", features = ["http1", "server"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }

# [profile.release] moved to workspace root Cargo.toml (per-crate profiles are ignored).
