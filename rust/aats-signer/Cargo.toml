[package]
name = "aats-signer"
version = "0.1.0"
edition = "2021"
description = "AATS minimal-surface signer (ADR-0009, infrastructure.md §5) — scaffold placeholder"

# SECURITY CONTRACT (ADR-0009, infrastructure.md §5.1):
#   This crate is the ONLY holder of the wallet secret.
#   It has NO inbound network, NO untrusted-byte decode.
#   It exposes ONE loopback Unix-domain socket operation:
#       sign(unsigned_tx_bytes, wallet_id) -> signed_tx_bytes
#   Socket is file-permission + peer-credential gated.
#
# SCAFFOLD NOTE:
#   The real signing/Vault/mlock logic is NOT yet implemented.
#   This binary is a minimal long-running scaffold that:
#     - Logs a clear "scaffold placeholder" message at startup
#     - Serves GET /health -> 200 on METRICS_PORT (default 9105)
#     - Loops forever so the container stays UP
#   Real implementation: T-251 / T-352a (crypto-security-engineer).
#
# REMOVED DEPS (were declared but unused in scaffold):
#   solana-sdk  — unused by scaffold
#   zeroize     — unused by scaffold (no secret to zeroize)
#   prometheus  — unused by scaffold
#   reqwest     — unused by scaffold (no Vault calls yet)
#   serde / serde_json — unused by scaffold
#   tracing / tracing-subscriber — unused by scaffold
#
# KEPT: tokio (async runtime) + hyper stack (HTTP /health endpoint for future healthcheck)

[[bin]]
name = "aats-signer"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
hyper = { version = "1", features = ["http1", "server"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }

# [profile.release] moved to workspace root Cargo.toml (per-crate profiles are ignored).
