# =============================================================================
# AATS control-plane reverse proxy — TLS + IP allowlist (E4)
# =============================================================================
# This is a DOCUMENTED recipe, not a running server. It is the ONLY sanctioned
# way to expose the control-plane API (and dashboard) to a REMOTE operator.
#
# THREAT MODEL
#   The control plane carries the destructive de-risk surface: /api/kill,
#   /api/flatten, /api/flatten/{mint}, /api/mode, /api/breaker/reset,
#   /api/risk-config. Those POSTs are already gated by an operator bearer token
#   in the app (server.py:_check_operator_auth) AND the app binds to loopback
#   (127.0.0.1) by default (aats/control_plane/app.py). This proxy adds the
#   network-perimeter layer for the case where an operator needs to reach the
#   box from elsewhere:
#       Internet --TLS--> nginx (IP allowlist + optional basic-auth) --> 127.0.0.1:8787
#   The upstream is loopback only; nginx is the ONLY thing listening on a public
#   interface. Compromising the perimeter still leaves the bearer token + the
#   de-risk-only contract between an attacker and any action.
#
# LAYERS (defense in depth, each independent):
#   1. TLS (Let's Encrypt or operator CA) — no plaintext bearer token on the wire.
#   2. allow/deny IP allowlist — only the operator's source IPs reach the API.
#   3. (optional) HTTP Basic auth — a second factor in front of the bearer token.
#   4. The app's own operator bearer token (unchanged; still required).
#   5. The de-risk-only contract — nothing here can increase risk regardless.
#
# DO NOT: terminate this on 0.0.0.0 without the IP allowlist; proxy_pass to a
# non-loopback upstream; or disable TLS. Each defeats a layer above.
# =============================================================================

# ---- IP allowlist: define operator source IPs here (replace placeholders) ----
# Use a geo/allow map so the list is maintained in one place. The control plane
# is single-operator; this should be a SHORT list (home IP, VPN egress).
geo $aats_cp_allowed {
    default        0;
    # 203.0.113.10  1;        # <operator-home-ip>      — REPLACE
    # 198.51.100.0/24 1;      # <operator-vpn-cidr>     — REPLACE
    127.0.0.1      1;         # local health probes
}

# ---- Rate limit the destructive surface (slow brute force of the token) ----
limit_req_zone $binary_remote_addr zone=aats_cp:10m rate=10r/s;

server {
    listen 443 ssl;
    http2  on;
    server_name aats-controlplane.example.internal;   # REPLACE

    # ---- TLS (layer 1) ----
    ssl_certificate     /etc/nginx/tls/aats-controlplane.fullchain.pem;   # REPLACE
    ssl_certificate_key /etc/nginx/tls/aats-controlplane.privkey.pem;     # REPLACE
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # ---- IP allowlist (layer 2): deny by default ----
    if ($aats_cp_allowed = 0) {
        return 403;
    }

    # ---- (optional) HTTP Basic auth (layer 3) ----
    # Create with: htpasswd -c /etc/nginx/aats-cp.htpasswd operator
    # Uncomment to require it IN ADDITION to the app bearer token.
    # auth_basic           "AATS control plane";
    # auth_basic_user_file /etc/nginx/aats-cp.htpasswd;

    # ---- Control-plane API -> loopback upstream (the app stays on 127.0.0.1) ----
    location /api/ {
        limit_req zone=aats_cp burst=20 nodelay;

        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (/api/feed): never buffer, keep the stream open.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_set_header   Connection "";
        proxy_http_version 1.1;
    }

    # ---- Operator dashboard (static UI) -> loopback upstream ----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# ---- Force HTTPS: no plaintext bearer tokens ever ----
server {
    listen 80;
    server_name aats-controlplane.example.internal;   # REPLACE
    return 301 https://$host$request_uri;
}
