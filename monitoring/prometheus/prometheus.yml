# AATS Prometheus scrape configuration
# Matches the service topology in docker-compose.yml and infrastructure.md §7.
#
# Each Python service exposes /metrics on its METRICS_PORT.
# The Rust hot core (aats-hotcore) exposes /metrics on 9102.
# The signer exposes a heartbeat-only /metrics on 9105.

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 8s
  external_labels:
    cluster: aats
    environment: '${AATS_ENV:-sim}'

# ── Alerting ─────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ── Alert rules ──────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/rules/*.yml

# ── Scrape targets ───────────────────────────────────────────────────────
scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Python SLOW loop
  - job_name: aats-slow
    static_configs:
      - targets: ['aats-slow:9101']
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Rust hot core (SNIPE + FAST)
  - job_name: aats-hotcore
    static_configs:
      - targets: ['aats-hotcore:9102']
    metrics_path: /metrics

  # Control plane API
  - job_name: aats-controlplane
    static_configs:
      - targets: ['aats-controlplane:9103']
    metrics_path: /metrics

  # Telegram bot
  - job_name: aats-telegram
    static_configs:
      - targets: ['aats-telegram:9104']
    metrics_path: /metrics

  # aats-signer (heartbeat-only; minimal surface)
  - job_name: aats-signer
    static_configs:
      - targets: ['aats-signer:9105']
    metrics_path: /metrics

  # Dead-man's switch watchdog
  - job_name: aats-dms
    static_configs:
      - targets: ['aats-dms:9106']
    metrics_path: /metrics
