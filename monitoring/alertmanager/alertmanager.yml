# AATS Alertmanager routing configuration
# Routes P1 alerts to Telegram (≤10s, AC-052/053) and optionally PagerDuty.
# Real credentials are NEVER in this file — they are injected via environment
# variables at runtime. See .env.example for the schema.
#
# Placeholders:
#   ALERTMANAGER_TELEGRAM_BOT_TOKEN — injected at runtime (Vault ref)
#   ALERTMANAGER_TELEGRAM_CHAT_ID   — injected at runtime
#   ALERTMANAGER_PAGERDUTY_KEY      — injected at runtime (if used)

global:
  resolve_timeout: 5m
  # Telegram bot token for alerting (NOT the operator bot — a dedicated alert bot)
  # Real value injected at runtime; placeholder here for config validation.
  http_config:
    follow_redirects: true

route:
  group_by: ['alertname', 'module', 'severity']
  group_wait: 5s        # fast grouping for P1 (≤10s total target)
  group_interval: 30s
  repeat_interval: 4h
  # PAPER-STACK DEFAULT: all routes drain to null until live credentials are
  # injected at R3 (real-capital gate). The route topology is preserved so
  # `amtool config routes` can be validated before going live.
  receiver: 'default-null'

  routes:
    # P1 critical — circuit breaker, DMS imminent, heartbeat dead, position drift
    # PAPER: wired to null until ALERTMANAGER_TELEGRAM_BOT_TOKEN is set at R3.
    - matchers:
        - severity="critical"
      receiver: 'default-null'
      group_wait: 2s       # fastest possible

    # P2 warnings — land rate low, Geyser stale, FAST tick breach, GATE-B
    - matchers:
        - severity="warning"
      receiver: 'default-null'
      group_wait: 30s

receivers:
  # PAPER-STACK: single null receiver; all alerts are collected but not dispatched.
  # At R3 (real-capital gate), add live telegram-p1 / telegram-p2 / pagerduty-p1
  # receivers below and update the route topology. Real Telegram/PagerDuty credentials
  # are NOT stored here — they are injected via envsubst wrapper at deploy time.
  # See deploy/alertmanager-entrypoint.sh and .env.example for the schema.
  - name: 'default-null'

  # Receiver templates (DISABLED — no credentials at paper-stack time):
  # To enable at R3: uncomment, inject real credentials via .env, and update routes above.
  #
  # - name: telegram-p1
  #   telegram_configs:
  #     - bot_token: '<real-bot-token-from-vault>'
  #       chat_id: <real-chat-id-integer>
  #       parse_mode: HTML
  #       message: |
  #         <b>P1 ALERT: {{ .GroupLabels.alertname }}</b>
  #         {{ range .Alerts }}
  #         <b>Summary:</b> {{ .Annotations.summary }}
  #         <b>Description:</b> {{ .Annotations.description }}
  #         <b>Since:</b> {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
  #         {{ end }}
  #       send_resolved: true
  #       http_config:
  #         follow_redirects: true
  #
  # - name: telegram-p2
  #   telegram_configs:
  #     - bot_token: '<real-bot-token-from-vault>'
  #       chat_id: <real-chat-id-integer>
  #       parse_mode: HTML
  #       message: |
  #         <b>WARN: {{ .GroupLabels.alertname }}</b>
  #         {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
  #       send_resolved: true
  #
  # - name: pagerduty-p1
  #   pagerduty_configs:
  #     - routing_key: '<real-routing-key-from-vault>'
  #       severity: critical
  #       description: '{{ .GroupLabels.alertname }}: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

inhibit_rules:
  # If the module is dead (P1), suppress lower-severity alerts from same module
  - source_matchers:
      - alertname="ModuleHeartbeatDead"
    target_matchers:
      - severity="warning"
    equal: ['module']
